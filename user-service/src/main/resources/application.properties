server.port=8080

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/health_ai_userservice}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

security.jwt.secret=${JWT_SECRET}
security.jwt.ttl-seconds=900

app.mail.enabled=${APP_MAIL_ENABLED:false}
app.password-reset-url=${PASSWORD_RESET_URL:http://localhost:3000/reset-password}
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
